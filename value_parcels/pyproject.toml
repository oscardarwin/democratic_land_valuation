[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "title-boundary-valuation"
version = "0.1.0"
description = "Value parcels using an RBFIntepolation."
authors = [
    { name = "Oscar Darwin" }
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "rasterio>=1.3",   # optional but useful
    "pyproj>=3.6",     # optional for coordinate transformations
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "PyGObject"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.setuptools]
packages = ["title_boundary_valuation"]
